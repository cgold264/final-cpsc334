name: Java CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build
      run: mvn clean compile

    - name: Run Tests
      run: mvn test

    - name: Lint
      run: mvn checkstyle:check

    - name: Package
      run: mvn package -DskipTests
